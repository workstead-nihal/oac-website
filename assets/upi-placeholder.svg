<!-- Purpose: clearly non-scannable UPI placeholder; replace with an organiser-verified QR image before enabling donations. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title description">
  <title id="title">UPI QR placeholder, not for payment</title>
  <desc id="description">A gold outline with an X and replacement instructions. It is not a QR code.</desc>
  <rect width="320" height="320" rx="20" fill="#191919"/>
  <rect x="20" y="20" width="280" height="280" rx="12" fill="none" stroke="#f3b334" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M115 90l90 90m0-90-90 90" stroke="#d91515" stroke-width="10"/>
  <g fill="#fff8ed" font-family="sans-serif" text-anchor="middle"><text x="160" y="222" font-size="18">REPLACE WITH VERIFIED QR</text><text x="160" y="250" font-size="14">NOT FOR PAYMENT</text></g>
</svg>
