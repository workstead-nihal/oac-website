# Purpose: check source formatting, syntax, accessibility basics and broken links on every push and PR.
name: Website checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node is already available on GitHub-hosted runners; no npm install or website build is needed.
      - name: Formatting, syntax, content and local/public links
        run: node checks/site-check.cjs --external
      - name: Backend validation and duplicate prevention
        run: node apps-script/checks.cjs
