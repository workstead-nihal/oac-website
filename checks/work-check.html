<!-- Purpose: browser checks for all four dynamic collaboration forms, receipt validation and safe retries; no Google writes. -->
<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../"><title>OAC collaboration checks</title></head>
  <body>
    <h1>Collaboration checks — mocked submissions</h1><p id="result">Running…</p>
    <p id="form-status" tabindex="-1"></p>
    <form id="community-form" data-action="stall"><fieldset id="form-fields"><div id="work-fields"></div><label>Consent<input name="consent" type="checkbox" checked required></label><label>Leave empty<input name="website"></label></fieldset><button id="submit-form" type="submit">Submit</button></form>
    <a id="signup-link" href="join.html" hidden>Sign up</a><p id="work-status"></p><button id="retry-work" type="button">Retry</button>
    <script src="js/content.js"></script><script src="js/config.js"></script><script src="js/forms.js"></script><script src="js/work.js"></script>
    <script>
      // Runs the real form renderer and submit flow with local JSON and mocked receipts; no inputs, prints pass/fail.
      async function runWorkChecks() {
        const definitions = await readData('data/work.json');
        const originalFetch = window.fetch;
        const originalEndpoint = window.OAC_CONFIG.appsScriptUrl;
        const checks = [];
        let firstId;
        let failOnce = true;
        window.OAC_CONFIG.appsScriptUrl = 'https://script.google.com/macros/s/test/exec';
        // Returns local JSON for rendering or a mock receipt for POST; input: fetch URL/options, output: response.
        window.fetch = async function mockWorkFetch(url, options) {
          if (!options || options.method !== 'POST') {
            return originalFetch(url, options);
          }
          const entry = JSON.parse(options.body.get('payload'));
          if (failOnce) {
            failOnce = false;
            firstId = entry.requestId;
            throw new Error('offline');
          }
          if (entry.action === 'stall') {
            checks.push(entry.requestId === firstId);
          }
          return { ok: true, json: async () => ({ ok: true, code: entry.action + '_received', requestId: entry.requestId }) };
        };
        try {
          for (const definition of definitions.forms) {
            communityForm.dataset.action = definition.action;
            communityForm.hidden = false;
            await loadWork();
            for (const field of definition.fields) {
              communityForm.elements[field.name].value = field.options ? field.options[0] : field.type === 'tel' ? '9876543210' : field.type === 'email' ? 'test@example.com' : field.type === 'url' ? 'https://example.com' : 'Test enquiry';
            }
            clearFieldErrors();
            const payload = collectEntry();
            checks.push(payload.action === definition.action && payload.consent === true);
            await submitEntry({ preventDefault() {} });
            if (definition.action === 'stall') {
              checks.push(pendingEntry !== null && communityForm.elements.businessName.value === 'Test enquiry');
              await submitEntry({ preventDefault() {} });
            }
            checks.push(formStatus.className.includes('success') && pendingEntry === null);
          }
          document.getElementById('result').textContent = checks.every(Boolean) ? 'All checks passed' : 'A check failed';
          if (!checks.every(Boolean)) {
            throw new Error('Collaboration checks failed');
          }
        } finally {
          window.fetch = originalFetch;
          window.OAC_CONFIG.appsScriptUrl = originalEndpoint;
        }
      }
      runWorkChecks();
    </script>
  </body>
</html>
