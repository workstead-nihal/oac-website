<!-- Purpose: dependency-free browser checks for Home countdown edge cases and safe social URLs. -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../"><title>OAC Home checks</title></head><body>
<h1>Home checks</h1><p id="result">Running…</p>
<!-- Hidden elements let the unmodified Home script run against its usual page contract. -->
<div hidden><div id="event-title"></div><div id="event-description"></div><div id="event-venue"></div><div id="event-date"></div><div id="event-price"></div><div id="countdown"></div><div id="announcements"></div><div id="social-links"></div><div id="data-status"></div><div id="event-sample"></div><div id="event-sample-note"></div></div>
<script src="js/content.js"></script>
<script src="js/home.js"></script>
<script>
// Runs the real countdown and link renderer with edge-case inputs; prints a pass/fail result.
function runChecks() {
  const now = Date.parse('2026-10-07T00:00:00+05:30');
  const checks = [
    countdownText('2026-10-31T00:00:00+05:30', now) === '24 days · 0 hours · 0 minutes to go',
    countdownText('invalid', now) === 'Event time to be confirmed',
    countdownText('2026-10-01T00:00:00+05:30', now).includes('has arrived')
  ];
  showSocialLinks([{ label: 'Unsafe', url: 'javascript:alert(1)' }, { label: 'Empty', url: '' }, { label: 'Valid', url: 'https://example.com' }]);
  checks.push(document.querySelectorAll('#social-links a').length === 1);
  showSocialLinks(['Instagram', 'Discord', 'Reddit', 'WhatsApp'].map(label => ({ label, url: 'https://example.com' })));
  checks.push(document.querySelectorAll('#social-links .social-icon').length === 4);
  checks.push(Array.from(document.querySelectorAll('#social-links .social-icon')).every(icon => icon.alt === '' && icon.width === 22));
  document.getElementById('result').textContent = checks.every(Boolean) ? 'All checks passed' : 'A check failed';
  if (!checks.every(Boolean)) { throw new Error('Home checks failed'); }
}
runChecks();
</script></body></html>
