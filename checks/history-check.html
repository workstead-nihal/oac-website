<!-- Purpose: dependency-free browser checks for chronological OAC milestones and honest sample rendering. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="../">
    <title>OAC history checks</title>
  </head>
  <body>
    <h1>History checks</h1>
    <p id="result">Running…</p>
    <div hidden>
      <time id="history-start"></time>
      <time id="history-today"></time>
      <ol id="history-milestones"></ol>
      <p id="history-note"></p>
      <p id="history-status"></p>
      <button id="retry-history" type="button">Retry</button>
    </div>
    <script src="js/content.js"></script>
    <script src="js/history.js"></script>
    <script>
      // Exercises real sorting and rendering; takes no inputs, prints a pass/fail result and throws on failure.
      function runHistoryChecks() {
        const entries = [
          { date: '2024-01-01', title: 'Later', description: 'Test', sample: false },
          { date: '2021-01-01', title: 'Earlier', description: 'Test', sample: false },
          { date: '2027-01-01' }, { date: '2019-01-01' }, { date: '2024-02-30' },
          { date: null, title: 'Placeholder', description: 'Test', sample: true }
        ];
        const sorted = historyMilestones(entries, '2020-02-13', '2026-10-08');
        const checks = [sorted.length === 3, sorted[0].title === 'Earlier', sorted[2].sample === true, entries[0].title === 'Later'];
        showHistory({ startDate: '2020-02-13', items: sorted }, '2026-10-08');
        checks.push(document.querySelectorAll('#history-milestones li').length === 3);
        checks.push(document.getElementById('history-note').textContent.includes('layout sample'));
        checks.push(document.getElementById('history-today').dateTime === '2026-10-08');
        showHistory({ startDate: '2020-02-13', items: [] }, '2026-10-08');
        checks.push(document.getElementById('history-note').textContent.includes('More milestones'));
        document.getElementById('result').textContent = checks.every(Boolean) ? 'All checks passed' : 'A check failed';
        if (!checks.every(Boolean)) {
          throw new Error('History checks failed');
        }
      }
      runHistoryChecks();
    </script>
  </body>
</html>
