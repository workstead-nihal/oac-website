<!-- Purpose: dependency-free checks for calendar encoding, India date grouping and safe ticket URLs. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>OAC Events checks</title>
</head>
<body data-page="events">
  <h1>Events checks</h1>
  <p id="result">Running…</p>
  <div hidden>
    <div id="upcoming-events"></div>
    <div id="past-events"></div>
    <p id="catalogue-status"></p>
    <button id="retry-content" type="button">Retry</button>
  </div>
  <script src="js/content.js"></script>
  <script src="js/events.js"></script>
  <script>
    // Runs real helper functions with edge cases; takes no inputs and displays pass/fail text.
    function runChecks() {
      const event = {
        id: 'sample', title: 'Anime & friends', sample: true,
        countdownDate: '2026-10-31T00:00:00+05:30',
        startTime: null, endTime: null,
        venue: 'Bhubaneswar', description: 'Cosplay + community', tiers: []
      };
      const calendar = new URL(calendarAddress(event));
      const groups = groupEvents([event], new Date('2026-10-30T19:00:00Z'));
      const checks = [
        calendar.searchParams.get('dates') === '20261031/20261101',
        calendar.searchParams.get('text') === '[SAMPLE] Anime & friends',
        groups.upcoming.length === 1,
        groupEvents([event], new Date('2026-11-01T00:00:00+05:30')).past.length === 1,
        ticketAddress('javascript:alert(1)') === null,
        ticketAddress('') === null,
        ticketAddress('https://example.com') === 'https://example.com/'
      ];
      event.startTime = '2026-10-31T18:00:00+05:30';
      event.endTime = '2026-10-31T21:00:00+05:30';
      checks.push(new URL(calendarAddress(event)).searchParams.get('dates') === '20261031T123000Z/20261031T153000Z');
      document.getElementById('result').textContent = checks.every(Boolean) ? 'All checks passed' : 'A check failed';
      if (!checks.every(Boolean)) {
        throw new Error('Events checks failed');
      }
    }
    runChecks();
  </script>
</body>
</html>
